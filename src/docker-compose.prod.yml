services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_password
      POSTGRES_DB: disaster_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_user -d disaster_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://disaster_user:disaster_password@db:5432/disaster_db
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # In production, we run via gunicorn for performance, but uvicorn with workers is fine
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_prod_data:
