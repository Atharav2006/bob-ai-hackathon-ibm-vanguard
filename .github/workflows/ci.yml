name: CI

on: [push, pull_request]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: disaster_user
          POSTGRES_PASSWORD: disaster_password
          POSTGRES_DB: disaster_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Wait for PostgreSQL readiness
        run: sleep 5
          
      - name: Verify Alembic Migrations Paths
        env:
          TEST_DATABASE_URL: postgresql://disaster_user:disaster_password@localhost:5432/disaster_db
        run: python verify_migrations.py
        
      - name: Run Alembic migrations
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql://disaster_user:disaster_password@localhost:5432/disaster_db
          JWT_SECRET_KEY: ci-test-secret
        run: |
          alembic upgrade head
          
      - name: Run Planner Tests
        working-directory: src/backend
        env:
          PYTHONPATH: .
        run: python -m unittest tests/test_planner.py
        
      - name: Run Integration Tests
        working-directory: src/backend
        env:
          TEST_DATABASE_URL: postgresql://disaster_user:disaster_password@localhost:5432/disaster_db
          JWT_SECRET_KEY: ci-test-secret
          PYTHONPATH: .
        run: python -m pytest tests/test_integration.py

